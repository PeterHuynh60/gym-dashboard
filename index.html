<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Dashboard</title>
    <!-- Shared huynh.place design system (fonts, colors, header) + light/dark theme shared across
         *.huynh.place, applied before React mounts so there's no flash of the wrong theme. -->
    <link href="https://huynh.place/shared/huynh-ui.css" rel="stylesheet" />
    <script src="https://huynh.place/shared/huynh-ui.js"></script>
    <script>
      // Tailwind's dark: variant keys off a `.dark` class; mirror the shared theme into it.
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
